
services:
    server:
        container_name: server
        build:
            context: .
            dockerfile: Dockerfile
        command: python server.py --num_rounds=10
        environment:
            FLASK_RUN_PORT: 6000
            DOCKER_HOST_IP: host.docker.internal
        volumes:
            - .:/app
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "6000:6000"
            # - "8265:8265"
            # - "8000:8000"
        stop_signal: SIGINT
    # data-loader:
    #     container_name: data-loader
    #     build:
    #         context: .
    #         dockerfile: Dockerfile
    #     command: python helper/split_dataset.py --num_clients=10
    #     environment:
    #         FLASK_RUN_PORT: 6100
    #         DOCKER_HOST_IP: host.docker.internal
    #     volumes:
    #         - .:/app
    #         - /var/run/docker.sock:/var/run/docker.sock
    #     ports:
    #         - "6100:6100"
    #     stop_signal: SIGINT

    client1:
        container_name: client1
        build:
            context: .
            dockerfile: Dockerfile
        command: python client.py --server_address=server:8080
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: "3g"
        volumes:
            - .:/app
            - ./data/mnist_splits/client_1:/app/data
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - "6001:6001"
        depends_on:
            - server
            # - data-loader
        environment:
            FLASK_RUN_PORT: 6001
            container_name: client1
            DOCKER_HOST_IP: host.docker.internal
        stop_signal: SIGINT  

